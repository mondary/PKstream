name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/androidTV/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip && unzip -q gradle-8.11.1-bin.zip
      - name: Build adult and Kids APKs
        run: ../../gradle-8.11.1/bin/gradle :app:assembleAdultDebug :app:assembleKidsDebug
        working-directory: src/androidTV
      - uses: actions/upload-artifact@v4
        with:
          name: PK-Stream-TV-debug
          path: src/androidTV/app/build/outputs/apk/*/debug/*.apk

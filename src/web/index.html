<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070707">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>PK Stream</title>
<style>
:root{--bg:#070707;--panel:#141414;--card:#1a1a1a;--soft:#9a9a9a;--ink:#f5f5f5;--accent:#f0c44e;--line:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;padding:12px 4vw;transition:background 300ms,border-color 300ms;border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(7,7,7,.3);backdrop-filter:blur(20px);border-bottom-color:#ffffff08}
.brand{font-weight:900;letter-spacing:-.06em;font-size:22px;flex-shrink:0}
.brand b{color:var(--accent)}
.nav-search{flex:1;display:flex;justify-content:center;max-width:520px;margin:0 auto}
.nav-search input{width:100%;background:#181818;border:1px solid #444;border-radius:999px;color:#fff;font-size:16px;padding:12px 24px;outline:none;transition:border-color 200ms,box-shadow 200ms}
.nav-search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #f0c44e30}
.nav-search input::placeholder{color:#888}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:900;font-size:14px}

/* ── HERO ── */
.hero{position:relative;min-height:min(78dvh,680px);display:flex;align-items:end;padding:0 4vw 90px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transition:opacity 1.2s ease-in-out}
.hero-bg.hero-bg-b{opacity:0}
.hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#070707f4 0%,#070707a0 40%,transparent 70%),linear-gradient(0deg,var(--bg) 2%,transparent 40%)}
.hero-copy{position:relative;z-index:1;max-width:560px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800;margin-bottom:14px}
.hero h1{font-size:clamp(40px,6.5vw,88px);letter-spacing:-.07em;line-height:.86;margin-bottom:18px;text-wrap:balance}
.hero p{color:#d0d0d0;font-size:15px;line-height:1.6;max-width:440px;margin-bottom:24px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn-play{background:#fff;color:#111;font-weight:800;padding:13px 28px;border-radius:8px;font-size:15px;display:flex;align-items:center;gap:8px}
.btn-play:hover{background#ffffffe0}
.btn-info{background:#ffffff30;color:#fff;font-weight:700;padding:13px 22px;border-radius:8px;font-size:15px;backdrop-filter:blur(4px)}
.btn-info:hover{background:#ffffff45}

/* ── RAILS ── */
.rails{position:relative;z-index:2;margin-top:-40px;padding:0 4vw 56px}
.section{margin-bottom:40px}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.section-head h2{font-size:20px;letter-spacing:-.03em}
.section-head small{color:var(--soft);font-size:13px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(130px,10.5vw,190px);gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#333 transparent}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.card{scroll-snap-align:start;border:0;padding:0;text-align:left;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);transition:transform 200ms ease-out}
.poster img{width:100%;height:100%;object-fit:cover}
.card:hover .poster,.card.kb-focus .poster{transform:scale(1.04);outline:2px solid var(--accent);outline-offset:2px}
.card.kb-focus .poster{box-shadow:0 0 20px #f0c44e40}
.card-title{margin-top:8px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── SEARCH RESULTS (inline) ── */
.search-view{display:none;padding:100px 4vw 48px}
.search-view.open{display:block}
.search-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;max-width:1400px;margin:0 auto}
.search-hint{text-align:center;color:var(--soft);padding:60px 0;font-size:16px}

/* ── DETAIL ── */
.detail-overlay{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;overflow-y:auto}
.detail-overlay.open{display:block}
.detail-close{position:fixed;top:16px;right:4vw;z-index:95;width:44px;height:44px;border-radius:50%;background:#000000b0;display:grid;place-items:center;font-size:22px}
.detail-close:hover{background:#000000e0}
.detail-hero{position:relative;min-height:min(86dvh,760px);display:flex;align-items:end;padding:120px 5vw 78px;overflow:hidden}
.detail-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.detail-hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#090606 0%,#090606f2 28%,#090606b8 48%,transparent 82%),linear-gradient(0deg,var(--bg) 1%,transparent 42%)}
.detail-hero-content{position:relative;z-index:1;max-width:min(700px,52vw)}
.detail-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-weight:800;margin-bottom:18px}
.detail-hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(52px,8.2vw,132px);letter-spacing:-.08em;line-height:.76;margin-bottom:26px;text-wrap:balance}
.detail-meta{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700}
.badge-hd{background:#ffffff20;color:#fff}
.badge-vf{background:var(--accent);color:#111}
.badge-vost{background:#3b82f630;color:#6cb0ff;border:1px solid#3b82f660}
.detail-desc{color:#e0e0e0;font-size:clamp(15px,1.25vw,19px);line-height:1.55;max-width:680px;text-wrap:pretty}
.detail-actions{display:flex;gap:12px;margin-top:28px}.add-button{width:52px;height:52px;border-radius:50%;background:#252525;color:#fff;font-size:32px;line-height:1}.add-button:hover{background:#393939}
.detail-body{padding:28px 4vw 64px}
.detail-body h3{font-size:18px;margin-bottom:16px;font-weight:700}
.sources-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.source-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;transition:border-color 100ms,background 100ms}
.source-btn:hover{border-color:var(--accent);background:#222}
.source-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.no-sources{color:var(--soft);padding:20px 0}

/* ── SERIES BROWSER ── */
.series-browser{margin:0 0 32px}
.series-browser h3{margin-bottom:16px;font-size:18px}
.season-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px}
.season-tab{border:1px solid var(--line);border-radius:999px;background:#151515;color:#bbb;padding:9px 16px;font-weight:700;font-size:13px;white-space:nowrap}
.season-tab.active{background:#fff;color:#111;border-color:#fff}
.episode-rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.episode-card{border:1px solid var(--line);background:#131313;border-radius:12px;overflow:hidden;text-align:left;padding:0;color:inherit;cursor:pointer;transition:border-color 100ms}
.episode-card:hover{border-color:var(--accent)}
.episode-cover{aspect-ratio:16/9;background:#202020;overflow:hidden}
.episode-cover img{width:100%;height:100%;object-fit:cover}
.episode-copy{padding:14px}
.episode-kicker{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.episode-title{font-size:15px;font-weight:700;margin:6px 0 8px}
.episode-desc{color:#aaa;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── PLAYER ── */
.player-overlay{position:fixed;inset:0;z-index:200;background:#000;display:none;place-items:center}
.player-overlay.open{display:grid}
.player-box{width:100%;max-width:1100px}
.player-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.player-bar span{font-weight:700;font-size:14px}
.player-close{background:#ffffff20;border-radius:8px;padding:8px 14px;font-size:14px}
.player-frame{width:100%;aspect-ratio:16/9;border:0;background:#000}

/* ── KIDS IDENTITY ── */
body.kids{--bg:#07182c;--panel:#102a47;--card:#143456;--soft:#b5cae0;--ink:#f8fbff;--accent:#ffd84d;--line:#ffffff29;background:radial-gradient(circle at 82% -10%,#1b72b7 0,transparent 34%),var(--bg)}
body.kids .nav{background:#07182ce8;border-bottom-color:#ffffff16}
body.kids .nav.scrolled{background:#07182cf5;border-bottom-color:#ffffff29}
body.kids .brand{font-size:25px;color:#fff}
body.kids .brand b{color:var(--accent)}
body.kids .nav-search input{background:#123153;border-color:#ffffff3b;border-radius:14px;color:#fff}
body.kids .nav-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ffd84d38}
body.kids .avatar{background:var(--accent);color:#102541;border-radius:11px}
body.kids .hero{min-height:min(75dvh,700px)}
body.kids .hero-bg{background-position:center 18%;opacity:.56}
body.kids .hero-bg:after{background:linear-gradient(90deg,#07182cf5 0%,#07182cd7 43%,#07182c1c 80%),linear-gradient(0deg,var(--bg) 1%,transparent 43%)}
body.kids .kicker{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--accent);color:#102541;font-size:11px;letter-spacing:.1em}
body.kids .hero h1{letter-spacing:-.075em}
body.kids .hero p{color:#e2f0ff}
body.kids .btn-play{background:var(--accent);color:#102541;border-radius:12px;box-shadow:0 5px 0 #bd9417}
body.kids .btn-play:hover{background:#ffe47a}
body.kids .btn-info{background:#38c8ff26;border:1px solid #38c8ff70;color:#dff7ff;border-radius:12px}
body.kids .rails{margin-top:-48px}
body.kids .section-head h2{font-size:23px}
body.kids .section-head small{color:#9edfff}
body.kids .rail{gap:16px;scrollbar-color:#38c8ff80 transparent}
body.kids .poster{border-radius:16px;border:2px solid #ffffff12;background:#143456;box-shadow:0 8px 22px #0003}
body.kids .card:hover .poster,body.kids .card.kb-focus .poster{transform:translateY(-6px) rotate(-1deg);outline:0;border-color:var(--accent);box-shadow:0 15px 28px #0006}
body.kids .card.kb-focus .poster{box-shadow:0 0 0 4px #38c8ffb0,0 15px 28px #0006}
body.kids .card-title{font-weight:800}
body.kids .detail-overlay{background:var(--bg)}
body.kids .detail-close{background:#07182ce8;border:1px solid #ffffff26}
body.kids .detail-hero-bg:after{background:linear-gradient(90deg,#07182c 0%,#07182cf2 31%,#07182cb6 51%,transparent 85%),linear-gradient(0deg,var(--bg) 1%,transparent 42%)}
body.kids .detail-kicker,body.kids .episode-kicker{color:var(--accent)}
body.kids .badge-vf{background:var(--accent);color:#102541}
body.kids .badge-vost{background:#38c8ff29;color:#bfefff;border-color:#38c8ff70}
body.kids .season-tab{background:#102a47;border-color:#ffffff29;color:#d7e8fa}
body.kids .season-tab.active{background:var(--accent);border-color:var(--accent);color:#102541}
body.kids .episode-card{background:#102a47;border-color:#ffffff29}
body.kids .episode-card:hover{border-color:var(--accent)}
body.kids .source-btn{background:#102a47;border-color:#ffffff29}
body.kids .source-btn:hover{background:#173b62;border-color:var(--accent)}
body.kids .source-btn .dot{background:var(--accent)}
body.kids .search-view{background:var(--bg)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .search-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:600px){
  .nav{padding:10px 16px;gap:10px}
  .brand{font-size:18px}
  .nav-search input{font-size:14px;padding:8px 14px}
  .hero{padding:0 20px 64px;min-height:70dvh}
  .hero h1{font-size:42px}
  .hero p{font-size:14px}
  .rails{padding:0 20px 48px}
  .rail{grid-auto-columns:128px}
  .search-grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .detail-hero{min-height:78dvh;padding:100px 20px 44px}.detail-hero-content{max-width:100%}
  .detail-hero h1{font-size:58px}
  .detail-body{padding:20px}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="brand" onclick="goHome()" style="cursor:pointer">PK <b>STREAM</b></div>
  <div class="nav-search">
    <input id="search-input" type="search" placeholder="Rechercher un film ou une série…" autocomplete="off">
  </div>
  <div class="nav-right">
    <div class="avatar">P</div>
  </div>
</nav>

<!-- HOME -->
<header class="hero" id="hero-section">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-bg hero-bg-b" id="hero-bg-b"></div>
  <div class="hero-copy">
    <div class="kicker">À la une</div>
    <h1 id="hero-title">Chargement…</h1>
    <p id="hero-desc"></p>
    <div class="hero-actions">
      <button class="btn-play" id="hero-play">▶ Lecture</button>
      <button class="btn-info" id="hero-info">Plus d'infos</button>
    </div>
  </div>
</header>

<div class="rails" id="rails">
  <section class="section">
    <div class="section-head"><h2>Derniers films</h2><small>Ajoutés récemment</small></div>
    <div class="rail" id="rail-films"><div class="search-hint">Chargement…</div></div>
  </section>
  <section class="section" id="series-section">
    <div class="section-head"><h2>Dernières séries</h2><small>Ajoutées récemment</small></div>
    <div class="rail" id="rail-series"><div class="search-hint">Chargement…</div></div>
  </section>
  <section class="section" id="animes-section" style="display:none">
    <div class="section-head"><h2>Animés</h2><small>Ajoutés récemment</small></div>
    <div class="rail" id="rail-animes"><div class="search-hint">Chargement…</div></div>
  </section>
</div>

<!-- SEARCH RESULTS (inline, replaces home when searching) -->
<div class="search-view" id="search-view">
  <div id="search-results"></div>
</div>

<!-- DETAIL OVERLAY -->
<div class="detail-overlay" id="detail-overlay">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-hero">
    <div class="detail-hero-bg" id="detail-bg"></div>
    <div class="detail-hero-content">
      <div class="detail-kicker">Fiche complete</div>
      <h1 id="detail-title"></h1>
      <div class="detail-meta" id="detail-meta"></div>
      <p class="detail-desc" id="detail-desc"></p>
      <div class="detail-actions">
        <button class="btn-play" id="detail-play" onclick="playFirst()">▶ Lecture</button>
        <button class="add-button" type="button" aria-label="Ajouter a ma liste">+</button>
      </div>
    </div>
  </div>
  <div class="detail-body">
    <section id="series-browser" class="series-browser" style="display:none">
      <h3>Épisodes</h3>
      <div id="season-tabs" class="season-tabs"></div>
      <div id="episode-rail" class="episode-rail"></div>
    </section>
    <h3 id="sources-heading">Sources disponibles</h3>
    <div class="sources-grid" id="detail-sources"><div class="no-sources">Chargement…</div></div>
  </div>
</div>

<!-- PLAYER OVERLAY -->
<div class="player-overlay" id="player-overlay">
  <div class="player-box">
    <div class="player-bar">
      <span id="player-title"></span>
      <button class="player-close" onclick="closePlayer()">Fermer</button>
    </div>
    <iframe class="player-frame" id="player-frame" allow="autoplay; fullscreen; encrypted-media"></iframe>
  </div>
</div>

<script>
const API='api.php';
const KIDS=new URLSearchParams(location.search).has('kids')||location.pathname.endsWith('/kids.html');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let homeData=null,currentItem=null,currentType='film',detailStreams=[];

if(KIDS){
  document.body.classList.add('kids');
  document.title='PK Stream Kids';
  document.querySelector('.brand').innerHTML='PK <b>KIDS</b>';
  $('search-input').placeholder='Rechercher dans PK Kids…';
  $('animes-section').style.display='block';
  document.querySelector('.kicker').textContent='PK Kids - À la une';
  document.querySelector('#rail-films').closest('.section').querySelector('h2').textContent='Films animation';
  document.querySelector('#rail-series').closest('.section').querySelector('h2').textContent='Séries animation';
}

/* ── HOME ── */
let heroSlides=[],heroIdx=0,heroTimer=null;
function heroSlide(){
  const item=heroSlides[heroIdx];
  if(!item)return;
  const bgA=$('hero-bg'),bgB=$('hero-bg-b');
  const next=heroIdx%2===0?bgB:bgA;
  const prev=heroIdx%2===0?bgA:bgB;
  next.style.backgroundImage=`url("${item.backdrop||item.poster}")`;
  next.style.opacity='1';
  prev.style.opacity='0';
  $('hero-title').textContent=item.title;
  $('hero-play').onclick=()=>openDetail(item,'film');
  $('hero-info').onclick=()=>openDetail(item,'film');
  heroIdx=(heroIdx+1)%heroSlides.length;
}
async function loadHome(){
  try{
    const d=await fetch(`${API}?api=${KIDS?'kids':'featured'}`).then(r=>r.json());
    homeData=d;
    heroSlides=(d.films||[]).slice(0,8);
    if(heroSlides.length){
      heroSlide();
      heroSlide();
      heroTimer=setInterval(heroSlide,6000);
    }
    renderRail(d.films||[],'rail-films','film','films');
    renderRail(d.series||[],'rail-series','tv','series');
    if(KIDS)renderRail(d.animes||[],'rail-animes','tv','animes');
  }catch(e){
    $('hero-title').textContent='Erreur de chargement';
  }
}
function renderRail(items,id,type,key){
  const c=$(id);
  if(!items.length){c.innerHTML='<div class="search-hint">Aucun contenu.</div>';return;}
  c.innerHTML=items.map((it,i)=>
    `<button class="card" onclick="openDetail(homeData.${key}[${i}],'${type}')">
      <div class="poster"><img src="${esc(it.poster)}" alt="${esc(it.title)}" loading="lazy"></div>
      <div class="card-title">${esc(it.title)}</div>
    </button>`).join('');
}

/* ── SEARCH (live, inline) ── */
let searchTimer,lastSearchReq;
$('search-input').addEventListener('input',()=>{
  clearTimeout(searchTimer);
  const q=$('search-input').value.trim();
  if(q.length<1){
    $('search-view').classList.remove('open');
    $('hero-section').style.display='';
    $('rails').style.display='';
    $('search-results').innerHTML='';
    return;
  }
  searchTimer=setTimeout(()=>doSearch(q),250);
});
$('search-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    clearTimeout(searchTimer);
    const q=$('search-input').value.trim();
    if(q.length>=1)doSearch(q);
  }
});
async function doSearch(q){
  if(lastSearchReq&&lastSearchReq.abort)lastSearchReq.abort();
  $('search-results').innerHTML='<div class="search-hint">Recherche…</div>';
  $('search-view').classList.add('open');
  $('hero-section').style.display='none';
  $('rails').style.display='none';
  try{
    if(KIDS){
      const items=['films','series','animes'].flatMap(key=>homeData?.[key]||[]).filter(item=>item.title.toLocaleLowerCase('fr').includes(q.toLocaleLowerCase('fr')));
      if(!items.length){$('search-results').innerHTML='<div class="search-hint">Aucun résultat pour « '+esc(q)+' »</div>';return;}
      $('search-results').innerHTML=`<div class="search-grid">${items.map((it,i)=>
        `<button class="card" type="button" data-search-index="${i}"><div class="poster"><img src="${esc(it.poster)}" alt="${esc(it.title)}" loading="lazy"></div><div class="card-title">${esc(it.title)}</div></button>`).join('')}</div>`;
      $('search-results').querySelectorAll('[data-search-index]').forEach(card=>card.addEventListener('click',()=>{const item=items[Number(card.dataset.searchIndex)];openDetail(item,item.type||'tv');}));
      return;
    }
    const ctrl=new AbortController();
    lastSearchReq=ctrl;
    const d=await fetch(`${API}?api=search&q=${encodeURIComponent(q)}`,{signal:ctrl.signal}).then(r=>r.json());
    const items=d.results||[];
    if(d.rateLimited){$('search-results').innerHTML='<div class="search-hint">Recherche en cours — fs16 attend… Réessayez dans 20 sec.</div>';return;}
    if(!items.length){$('search-results').innerHTML='<div class="search-hint">Aucun résultat pour « '+esc(q)+' »</div>';return;}
    $('search-results').innerHTML=`<div class="search-grid">${items.map((it,i)=>
      `<button class="card" type="button" data-search-index="${i}">
        <div class="poster"><img src="${esc(it.poster)}" alt="${esc(it.title)}" loading="lazy"></div>
        <div class="card-title">${esc(it.title)}</div>
      </button>`).join('')}</div>`;
    $('search-results').querySelectorAll('[data-search-index]').forEach(card=>{
      card.addEventListener('click',()=>{
        const item=items[Number(card.dataset.searchIndex)];
        openDetail(item,titleMatchesSeries(item.title)?'tv':'film');
      });
    });
  }catch(e){
    $('search-results').innerHTML='<div class="search-hint">Erreur de recherche.</div>';
  }
}
function closeSearchView(){
  $('search-view').classList.remove('open');
  $('hero-section').style.display='';
  $('rails').style.display='';
  $('search-results').innerHTML='';
}

/* ── DETAIL ── */
async function openDetail(item,type){
  currentItem=item;currentType=type;
  closeSearchView();
  $('detail-overlay').classList.add('open');
  $('detail-overlay').scrollTop=0;
  $('detail-bg').style.backgroundImage='';
  $('detail-title').textContent=item.title;
  $('detail-desc').textContent='';
  $('detail-meta').innerHTML='';
  $('detail-sources').innerHTML='<div class="no-sources">Chargement…</div>';
  $('series-browser').style.display=type==='tv'?'block':'none';
  $('sources-heading').style.display=type==='tv'?'none':'block';
  $('detail-play').style.display='none';

  // Load details (backdrop, synopsis)
  try{
    const d=await fetch(`${API}?api=details&id=${item.newsid}&source=${encodeURIComponent(item.source||'fs16')}`).then(r=>r.json());
    if(d.backdrop)$('detail-bg').style.backgroundImage=`url("${d.backdrop}")`;
    else if(item.poster)$('detail-bg').style.backgroundImage=`url("${item.poster}")`;
    $('detail-desc').textContent=d.description||'Aucune description disponible.';
    const isSeries=type==='tv';
    const badges=['<span class="badge badge-hd">HD</span>'];
    badges.push(isSeries?'<span class="badge badge-vf">Série</span>':'<span class="badge badge-vf">Film</span>');
    badges.push('<span class="badge badge-vost">VF et VOSTFR</span>');
    $('detail-meta').innerHTML=badges.join('');
  }catch{}

  if(type==='film')loadDetailSources();
  else loadSeriesEpisodes();
}
function titleMatchesSeries(t){return/\s-\sSaison\s\d+/i.test(t)||/\s-\sS\d+E\d+/i.test(t);}
function currentSeason(){const match=currentItem?.title.match(/Saison\s(\d+)/i);return match?Number(match[1]):1;}
function baseTitle(t){return(t||'').replace(/\s*-\s*Saison\s*\d+.*$/i,'').trim();}
let allSeasons=[],activeSeason=1,activeSeasonNid='';
async function loadSeriesEpisodes(){
  activeSeason=currentSeason();
  activeSeasonNid=currentItem.newsid;
  $('episode-rail').innerHTML='<div class="no-sources">Chargement...</div>';
  $('season-tabs').innerHTML='<div class="no-sources">...</div>';
  if(currentItem.source==='anime')allSeasons=[];
  else{
    const bt=baseTitle(currentItem.title);
    try{
      const sd=await fetch(`${API}?api=seasons&title=${encodeURIComponent(bt)}&id=${currentItem.newsid}`).then(r=>r.json());
      allSeasons=sd.seasons||[];
    }catch{allSeasons=[];}
  }
  if(!allSeasons.length)allSeasons=[{season:activeSeason,newsid:currentItem.newsid,title:currentItem.title}];
  renderSeasonTabs();
  await loadEpisodesForSeason(activeSeason);
}
function renderSeasonTabs(){
  $('season-tabs').innerHTML=allSeasons.map(s=>
    `<button class="season-tab${s.season===activeSeason?' active':''}" type="button" data-season="${s.season}" data-nid="${s.newsid}">Saison ${s.season}</button>`
  ).join('');
  $('season-tabs').querySelectorAll('[data-season]').forEach(tab=>{
    tab.addEventListener('click',()=>{
      activeSeason=Number(tab.dataset.season);
      activeSeasonNid=tab.dataset.nid;
      renderSeasonTabs();
      loadEpisodesForSeason(activeSeason);
    });
  });
}
async function loadEpisodesForSeason(season){
  $('episode-rail').innerHTML='<div class="no-sources">Chargement des episodes...</div>';
  try{
    const data=await fetch(`${API}?api=episodes&id=${activeSeasonNid}&source=${encodeURIComponent(currentItem.source||'fs16')}`).then(r=>r.json());
    const episodes=data.episodes||[];
    if(!episodes.length){$('episode-rail').innerHTML='<div class="no-sources">Aucun episode disponible.</div>';return;}
    $('episode-rail').innerHTML=episodes.map((episode,index)=>`<button class="episode-card" type="button" data-episode-index="${index}"><div class="episode-cover">${episode.poster?`<img src="${esc(episode.poster)}" alt="" loading="lazy">`:''}</div><div class="episode-copy"><div class="episode-kicker">S${season} E${episode.number}</div><div class="episode-title">${esc(episode.title)}</div><div class="episode-desc">${esc(episode.synopsis||'Selectionner pour choisir une source.')}</div></div></button>`).join('');
    $('episode-rail').querySelectorAll('[data-episode-index]').forEach(card=>card.addEventListener('click',()=>openEpisodeSources(episodes[Number(card.dataset.episodeIndex)])));
  }catch{$('episode-rail').innerHTML='<div class="no-sources">Impossible de charger les episodes.</div>';}
}
async function openEpisodeSources(episode){
  $('sources-heading').style.display='block';
  $('sources-heading').textContent=`Sources - S${activeSeason} E${episode.number}`;
  $('detail-sources').innerHTML='<div class="no-sources">Chargement des sources...</div>';
  $('detail-play').style.display='none';
  try{
    const data=await fetch(`${API}?api=streams&id=${activeSeasonNid}&t=tv&s=${activeSeason}&e=${episode.number}&source=${encodeURIComponent(currentItem.source||'fs16')}`).then(r=>r.json());
    detailStreams=data.streams||[];
    if(!detailStreams.length){$('detail-sources').innerHTML='<div class="no-sources">Aucune source disponible pour cet episode.</div>';return;}
    $('detail-sources').innerHTML=detailStreams.map((s,i)=>`<button class="source-btn" type="button" onclick="playSource(${i})"><span class="dot"></span>${esc(s.title)}</button>`).join('');
    $('detail-play').style.display='flex';
  }catch{$('detail-sources').innerHTML='<div class="no-sources">Impossible de charger les sources.</div>';}
}
async function loadDetailSources(){
  if(!currentItem)return;
  $('detail-sources').innerHTML='<div class="no-sources">Chargement des sources…</div>';
  $('detail-play').style.display='none';
  try{
    let url;
    if(currentType==='tv'){
      const s=$('ep-season').value||1,e=$('ep-episode').value||1;
      url=`${API}?api=streams&id=${currentItem.newsid}&t=tv&s=${s}&e=${e}&source=${encodeURIComponent(currentItem.source||'fs16')}`;
    }else{
      url=`${API}?api=streams&id=${currentItem.newsid}&t=film&source=${encodeURIComponent(currentItem.source||'fs16')}`;
    }
    const d=await fetch(url).then(r=>r.json());
    detailStreams=d.streams||[];
    if(!detailStreams.length){
      $('detail-sources').innerHTML='<div class="no-sources">Aucune source disponible pour ce titre.</div>';
      return;
    }
    $('detail-sources').innerHTML=detailStreams.map((s,i)=>
      `<button class="source-btn" onclick="playSource(${i})"><span class="dot"></span>${esc(s.title)}</button>`).join('');
    $('detail-play').style.display='flex';
  }catch(e){
    $('detail-sources').innerHTML='<div class="no-sources">Erreur lors du chargement.</div>';
  }
}
function playFirst(){if(detailStreams.length)playSource(0);}
function playSource(i){
  const s=detailStreams[i];
  $('player-title').textContent=`${currentItem.title} — ${s.title}`;
  $('player-frame').src=s.url;
  $('player-overlay').classList.add('open');
}
function closeDetail(){$('detail-overlay').classList.remove('open');}
function closePlayer(){$('player-frame').src='';$('player-overlay').classList.remove('open');}

/* ── NAV ── */
window.addEventListener('scroll',()=>$('nav').classList.toggle('scrolled',scrollY>40));
function goHome(){closeSearchView();closeDetail();scrollTo({top:0,behavior:'smooth'});}
function goSeries(){closeSearchView();closeDetail();$('series-section').scrollIntoView({behavior:'smooth'});}

/* ── KEYBOARD NAV ── */
let kbRail=-1,kbIdx=-1;
function kbRails(){return [...document.querySelectorAll('.rail')];}
function kbCards(rail){return [...rail.querySelectorAll('.card')];}
function kbClear(){document.querySelectorAll('.card.kb-focus').forEach(c=>c.classList.remove('kb-focus'));}
function kbHighlight(){
  kbClear();
  const rails=kbRails();
  if(kbRail<0||kbRail>=rails.length)return;
  const cards=kbCards(rails[kbRail]);
  if(kbIdx<0||kbIdx>=cards.length)return;
  const card=cards[kbIdx];
  card.classList.add('kb-focus');
  card.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}
function kbEnter(){
  const rails=kbRails();
  if(kbRail<0||kbRail>=rails.length)return;
  const cards=kbCards(rails[kbRail]);
  if(kbIdx<0||kbIdx>=cards.length)return;
  cards[kbIdx].click();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePlayer();closeDetail();closeSearchView();$('search-input').blur();kbClear();kbRail=kbIdx=-1;return;}
  const el=document.activeElement;
  const isInput=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
  if(isInput)return;

  const rails=kbRails();
  if(!rails.length)return;

  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();
    if(kbRail<0)kbRail=0;
    const cards=kbCards(rails[kbRail]);
    if(!cards.length)return;
    if(kbIdx<0)kbIdx=0;
    else kbIdx+=e.key==='ArrowRight'?1:-1;
    kbIdx=Math.max(0,Math.min(kbIdx,cards.length-1));
    kbHighlight();
    return;
  }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(kbRail<0)kbRail=0;
    else kbRail+=e.key==='ArrowDown'?1:-1;
    kbRail=Math.max(0,Math.min(kbRail,rails.length-1));
    const cards=kbCards(rails[kbRail]);
    kbIdx=Math.min(kbIdx>=0?kbIdx:0,cards.length-1);
    kbHighlight();
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    kbEnter();
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){
    e.preventDefault();
    $('search-input').focus();
    $('search-input').value=$('search-input').value.slice(0,-1);
    $('search-input').dispatchEvent(new Event('input'));
    return;
  }
  if(e.key.length!==1)return;
  e.preventDefault();
  const inp=$('search-input');
  inp.focus();
  const start=inp.selectionStart||inp.value.length;
  const end=inp.selectionEnd||inp.value.length;
  inp.value=inp.value.slice(0,start)+e.key+inp.value.slice(end);
  inp.selectionStart=inp.selectionEnd=start+1;
  inp.dispatchEvent(new Event('input'));
});

loadHome();
</script>
